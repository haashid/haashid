<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="80%" stop-color="#0A1E3F" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#00F5FF" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="25%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="75%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#06B6D4" opacity="0.3" />
    </pattern>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; r: 5; }
        50% { opacity: 0.3; r: 3.5; }
      }
      .online-dot { animation: pulseDot 2s infinite ease-in-out; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 3px;
      }
      .mono-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      }
    </style>
  </defs>

  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="url(#cyberGrid)" />
  <rect x="2" y="2" width="1196" height="336" rx="15" fill="none" stroke="url(#borderGlow)" stroke-width="2" opacity="0.85" />

  <!-- Corner Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#00F5FF" stroke-width="3" />
  <path d="M 1150 20 L 1180 20 L 1180 50" fill="none" stroke="#00F5FF" stroke-width="3" />
  <path d="M 20 290 L 20 320 L 50 320" fill="none" stroke="#00F5FF" stroke-width="3" />
  <path d="M 1150 320 L 1180 320 L 1180 290" fill="none" stroke="#00F5FF" stroke-width="3" />

  <!-- Status HUD Pill -->
  <g transform="translate(370, 26)">
    <rect width="460" height="32" rx="16" fill="#030712" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="24" cy="16" r="4.5" fill="#10B981" class="online-dot" />
    <text x="38" y="21" fill="#94A3B8" class="mono-text" font-size="12" font-weight="600" letter-spacing="1.5">OPERATOR: <tspan fill="#38BDF8">HAASHID</tspan> // <tspan fill="#10B981">ONLINE</tspan> // <tspan fill="#A78BFA">MANGALURU, IN</tspan></text>
  </g>

  <!-- Circuit Traces -->
  <path d="M 60 70 L 180 70 L 210 100" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.4" />
  <circle cx="210" cy="100" r="3" fill="#00F5FF" opacity="0.6" />
  <path d="M 1140 70 L 1020 70 L 990 100" fill="none" stroke="#818CF8" stroke-width="1.5" opacity="0.4" />
  <circle cx="990" cy="100" r="3" fill="#C084FC" opacity="0.6" />

  <!-- Name Title -->
  <text x="600" y="145" text-anchor="middle" class="title-text" font-size="52" fill="url(#neonText)" filter="url(#softGlow)">
    MUHAMMAD HAASHID
  </text>

  <!-- Professional Subtitle -->
  <text x="600" y="190" text-anchor="middle" class="mono-text" font-size="16" font-weight="600" fill="#E2E8F0" letter-spacing="2.5">
    AI ENGINEER  •  SOFTWARE DEVELOPER  •  PRODUCT ENGINEER
  </text>

  <!-- Cyber Divider -->
  <line x1="260" y1="216" x2="940" y2="216" stroke="url(#borderGlow)" stroke-width="1.5" opacity="0.7" />
  <polygon points="600,212 605,216 600,220 595,216" fill="#00F5FF" />

  <!-- 3 Highlights Badges -->
  <g transform="translate(140, 246)">
    <rect width="280" height="48" rx="10" fill="url(#cardBg)" stroke="#38BDF8" stroke-width="1.2" />
    <text x="20" y="30" font-size="20">🏆</text>
    <text x="50" y="24" class="title-text" font-size="12" fill="#F8FAFC" font-weight="700" letter-spacing="1">8X HACKATHON WINNER</text>
    <text x="50" y="38" class="mono-text" font-size="11" fill="#38BDF8">Innov8trix • IIT KGP • HackToFuture</text>
  </g>

  <g transform="translate(460, 246)">
    <rect width="280" height="48" rx="10" fill="url(#cardBg)" stroke="#818CF8" stroke-width="1.2" />
    <text x="20" y="30" font-size="20">🌐</text>
    <text x="50" y="24" class="title-text" font-size="12" fill="#F8FAFC" font-weight="700" letter-spacing="1">GOOGLE AMBASSADOR</text>
    <text x="50" y="38" class="mono-text" font-size="11" fill="#A5B4FC">Cohort 2026 • IEEE SMC Chair</text>
  </g>

  <g transform="translate(780, 246)">
    <rect width="280" height="48" rx="10" fill="url(#cardBg)" stroke="#34D399" stroke-width="1.2" />
    <text x="20" y="30" font-size="20">🎓</text>
    <text x="50" y="24" class="title-text" font-size="12" fill="#F8FAFC" font-weight="700" letter-spacing="1">CS ENGINEER • GPA 8.2</text>
    <text x="50" y="38" class="mono-text" font-size="11" fill="#34D399">IoT, CyberSec &amp; Blockchain @ PACE</text>
  </g>
</svg>